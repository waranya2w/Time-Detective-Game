<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Detective Junior - นักสืบกาลเวลาจูเนียร์</title>
    
    <!-- Google Fonts: Mali -->
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Mali', 'sans-serif'] },
                    colors: {
                        navy: '#0f172a',
                        indigo: '#312e81'
                    },
                    animation: {
                        'shake': 'shake 0.5s infinite',
                        'pop': 'pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
                        'float': 'float 3s ease-in-out infinite'
                    },
                    keyframes: {
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '25%': { transform: 'translateX(-5px)' },
                            '75%': { transform: 'translateX(5px)' }
                        },
                        pop: {
                            '0%': { transform: 'scale(0.5)', opacity: 0 },
                            '100%': { transform: 'scale(1)', opacity: 1 }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Custom CSS for 3D Bubble & Glassmorphism -->
    <style>
        body { margin: 0; overflow: hidden; background-color: #0f172a; touch-action: none; }
        
        .glass-bubble {
            background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 2px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 30px 0 rgba(0, 0, 0, 0.5), 
                        inset 0 8px 12px 0 rgba(255,255,255,0.6),
                        inset 0 -4px 10px 0 rgba(0,0,0,0.2);
            border-radius: 2.5rem;
        }

        .btn-3d {
            transition: all 0.15s ease;
            box-shadow: 0 10px 0px 0 rgba(0,0,0,0.6), 0 20px 25px rgba(0,0,0,0.5);
            border-radius: 9999px; /* Rounded full */
        }
        
        .btn-3d:active {
            transform: translateY(10px);
            box-shadow: 0 0px 0px 0 rgba(0,0,0,0.6), 0 5px 10px rgba(0,0,0,0.5);
        }

        /* Mirror video for natural movement */
        .mirror { transform: scaleX(-1); }
        
        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- MediaPipe Face Detection -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- Web Audio API Synthesizer (สร้างเสียงประกอบในตัว) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const playTone = (freq, type, duration, vol=0.1) => {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.stop(audioCtx.currentTime + duration);
        };

        const soundFX = {
            click: () => playTone(600, 'sine', 0.1, 0.15),
            tick: () => playTone(800, 'square', 0.05, 0.05),
            correct: () => { playTone(523.25, 'sine', 0.1); setTimeout(()=>playTone(659.25, 'sine', 0.3), 100); },
            wrong: () => playTone(150, 'sawtooth', 0.4),
            reset: () => { playTone(440, 'sine', 0.1); setTimeout(()=>playTone(880, 'sine', 0.2), 150); },
            portal: () => {
                for(let i=0; i<15; i++) setTimeout(() => playTone(200 + i*40, 'sine', 0.1, 0.2), i*40);
            },
            endgame: () => {
                playTone(523.25, 'sine', 0.2);
                setTimeout(()=>playTone(659.25, 'sine', 0.2), 200);
                setTimeout(()=>playTone(783.99, 'sine', 0.4), 400);
            }
        };

        // --- Main App Component ---
        const App = () => {
            // States ของระบบแอป
            const [gameState, setGameState] = useState('HOME'); // HOME, TRANSITION, PLAYING, END
            const [version, setVersion] = useState(1); // 1: นาที->วินาที, 2: วินาที->นาที
            const [showMenu, setShowMenu] = useState(false);
            const [showRules, setShowRules] = useState(false);
            const [muted, setMuted] = useState(false);
            
            // States ของตรรกะเกม
            const [phase, setPhase] = useState('IDLE'); // ASKING, ANSWERING, RESETTING
            const [timer, setTimer] = useState(10);
            const [qIndex, setQIndex] = useState(0);
            const [question, setQuestion] = useState(null);
            const [camActive, setCamActive] = useState(false);
            
            // Refs สำหรับกล้องและการแทร็ก
            const videoRef = useRef(null);
            const [faces, setFaces] = useState([]); 
            const [wrongFaces, setWrongFaces] = useState([]); // เก็บผู้เล่นที่ตอบผิดเพื่อแสดงอิโมจิ😭
            
            // Refs สำหรับเสียง BGM
            const homeMusicRef = useRef(new Audio('soundhomepage.wav'));
            
            // จัดการ BGM หน้าแรก
            useEffect(() => {
                homeMusicRef.current.loop = true;
                homeMusicRef.current.volume = 0.5;
                if (!muted && gameState === 'HOME') {
                    // ป้องกัน Browser block auto-play
                    homeMusicRef.current.play().catch(e => console.log("รอการคลิกจากผู้ใช้เพื่อเล่นเสียง"));
                } else {
                    homeMusicRef.current.pause();
                }
            }, [gameState, muted]);

            // --- MediaPipe Face Detection ---
            useEffect(() => {
                if(!videoRef.current) return;
                
                const faceDetection = new FaceDetection({locateFile: (file) => {
                    return `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}`;
                }});
                
                faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });
                
                faceDetection.onResults((results) => {
                    if (results.detections) {
                        setFaces(results.detections.map(d => d.boundingBox));
                    } else {
                        setFaces([]);
                    }
                });

                const camera = new Camera(videoRef.current, {
                    onFrame: async () => { 
                        if(videoRef.current) await faceDetection.send({image: videoRef.current}); 
                    },
                    width: 1280,
                    height: 720
                });
                
                camera.start().then(() => setCamActive(true));
            }, []);

            // --- ฟังก์ชันสร้างคำถาม ---
            const generateQuestion = (ver) => {
                let q, ans, wrongAns;
                if (ver === 1) { // นาที -> วินาที (สุ่ม 1-10 นาที)
                    const min = Math.floor(Math.random() * 10) + 1;
                    q = `${min} นาที`;
                    ans = min * 60;
                    wrongAns = ans + (Math.random() > 0.5 ? 60 : -60 > 0 ? -60 : 120);
                    return { text: q, correctText: `${ans} วินาที`, wrongText: `${wrongAns} วินาที`, isLeftCorrect: Math.random() > 0.5 };
                } else { // วินาที -> นาที (สุ่ม 60-360 วินาที)
                    const min = Math.floor(Math.random() * 6) + 1;
                    const sec = min * 60;
                    q = `${sec} วินาที`;
                    ans = min;
                    wrongAns = ans + (Math.random() > 0.5 ? 1 : -1 > 0 ? -1 : 2);
                    return { text: q, correctText: `${ans} นาที`, wrongText: `${wrongAns} นาที`, isLeftCorrect: Math.random() > 0.5 };
                }
            };

            // --- Game Loop (จับเวลาและจัดการ Phase) ---
            useEffect(() => {
                if (gameState !== 'PLAYING') return;

                let interval;
                if (phase === 'ASKING') {
                    interval = setInterval(() => {
                        setTimer(t => {
                            if (t > 1) { 
                                if(!muted) soundFX.tick(); 
                                return t - 1; 
                            } else {
                                handleTimeUp();
                                return 0;
                            }
                        });
                    }, 1000);
                } else if (phase === 'ANSWERING') {
                    interval = setTimeout(() => {
                        setPhase('RESETTING');
                        setTimer(5);
                        setWrongFaces([]); 
                        if(!muted) soundFX.reset();
                    }, 3000); // เฉลยคำตอบและแสดงผล 3 วินาที
                } else if (phase === 'RESETTING') {
                    interval = setInterval(() => {
                        setTimer(t => {
                            if (t > 1) {
                                if(!muted) soundFX.tick();
                                return t - 1;
                            } else {
                                nextQuestion();
                                return 0;
                            }
                        });
                    }, 1000);
                }
                return () => { clearInterval(interval); clearTimeout(interval); };
            }, [phase, gameState, muted]);

            const handleTimeUp = () => {
                setPhase('ANSWERING');
                
                // คำนวณคำตอบจากตำแหน่งผู้เล่น
                // หน้าจอถูก Mirror ดังนั้น: ซ้ายจอ = x ของกล้อง > 0.66, ขวาจอ = x ของกล้อง < 0.33
                let anyoneWrong = false;
                let anyoneRight = false;
                const errFaces = [];

                faces.forEach(face => {
                    const xCenter = face.xCenter;
                    let currentZone = 'center';
                    if (xCenter > 0.66) currentZone = 'left';
                    else if (xCenter < 0.33) currentZone = 'right';

                    const correctZone = question.isLeftCorrect ? 'left' : 'right';

                    if (currentZone === correctZone) {
                        anyoneRight = true;
                    } else if (currentZone !== 'center') {
                        anyoneWrong = true;
                        errFaces.push(face); // เก็บตำแหน่งคนที่ตอบผิด
                    }
                });

                setWrongFaces(errFaces);

                if (anyoneRight && !anyoneWrong) {
                    if(!muted) soundFX.correct();
                } else if (anyoneWrong) {
                    if(!muted) soundFX.wrong();
                } else {
                    if(!muted) soundFX.wrong(); 
                }
            };

            const nextQuestion = () => {
                if (qIndex >= 9) { // ครบ 10 ข้อ
                    if(!muted) soundFX.endgame();
                    setGameState('END');
                } else {
                    setQIndex(q => q + 1);
                    setQuestion(generateQuestion(version));
                    setPhase('ASKING');
                    setTimer(10);
                }
            };

            const startGame = () => {
                if(!muted) { soundFX.click(); soundFX.portal(); }
                setShowMenu(false);
                setShowRules(false);
                setGameState('TRANSITION');
            };

            const initGameVariables = () => {
                setQIndex(0);
                setQuestion(generateQuestion(version));
                setPhase('ASKING');
                setTimer(10);
                setWrongFaces([]);
                setGameState('PLAYING');
            };

            // --- ส่วน Render UI ---
            return (
                <div className="relative w-screen h-screen overflow-hidden bg-navy text-white font-sans select-none flex flex-col items-center justify-center">
                    
                    {/* กล้องพื้นหลัง (เปิดตลอด แต่ปรับ Opacity ให้เนียนไปกับพื้นหลัง) */}
                    <video 
                        ref={videoRef} 
                        className={`absolute inset-0 w-full h-full object-cover mirror transition-opacity duration-1000 ${gameState === 'PLAYING' ? 'opacity-100' : 'opacity-0'}`} 
                        autoPlay playsInline muted
                    />

                    {/* ปุ่ม Mute ที่มุมจอ */}
                    <button 
                        onClick={() => { setMuted(!muted); soundFX.click(); }}
                        className="absolute top-6 right-6 z-50 glass-bubble w-16 h-16 flex items-center justify-center text-3xl btn-3d"
                    >
                        {muted ? '🔇' : '🔊'}
                    </button>

                    {/* --- หน้าแรก (HOME) --- */}
                    {gameState === 'HOME' && (
                        <div className="absolute inset-0 z-20 flex flex-col items-center justify-end pb-12">
                            <video src="homepage.mp4" autoPlay loop muted className="absolute inset-0 w-full h-full object-cover -z-10" />
                            
                            <div className="flex gap-8 items-end animate-float">
                                {/* ปุ่มกติกา */}
                                <img src="howtoplaybutton_2.png" alt="How to Play" 
                                    className="w-[200px] cursor-pointer hover:scale-110 btn-3d rounded-3xl border-2 border-white/20"
                                    onClick={() => { if(!muted) soundFX.click(); setShowRules(true); setShowMenu(false); }} />
                                
                                {/* ปุ่มเริ่มเกม (เด่นสุด) */}
                                <img src="startbutton_2.png" alt="Start Game" 
                                    className="w-[280px] cursor-pointer hover:scale-110 btn-3d rounded-[2.5rem] border-4 border-yellow-300/50"
                                    onClick={startGame} />
                                
                                {/* ปุ่มเมนูเลือกเวอร์ชั่น */}
                                <img src="menubutton_2.png" alt="Menu" 
                                    className="w-[200px] cursor-pointer hover:scale-110 btn-3d rounded-3xl border-2 border-white/20"
                                    onClick={() => { if(!muted) soundFX.click(); setShowMenu(true); setShowRules(false); }} />
                            </div>

                            {/* Bubble Modal: เลือกเวอร์ชั่น */}
                            {showMenu && (
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 glass-bubble p-10 flex flex-col items-center animate-pop w-[500px]">
                                    <h2 className="text-4xl font-bold mb-8 text-yellow-300 drop-shadow-md">เลือกภารกิจ</h2>
                                    
                                    <button 
                                        className={`px-6 py-5 mb-6 text-2xl font-bold rounded-3xl w-full btn-3d border-4 transition-all ${version === 1 ? 'bg-indigo-600 border-yellow-400 scale-105' : 'bg-navy/80 border-transparent text-gray-300'}`}
                                        onClick={() => { if(!muted) soundFX.click(); setVersion(1); }}
                                    >
                                        ⏳ เปลี่ยน นาที ➔ วินาที
                                    </button>
                                    
                                    <button 
                                        className={`px-6 py-5 text-2xl font-bold rounded-3xl w-full btn-3d border-4 transition-all ${version === 2 ? 'bg-indigo-600 border-yellow-400 scale-105' : 'bg-navy/80 border-transparent text-gray-300'}`}
                                        onClick={() => { if(!muted) soundFX.click(); setVersion(2); }}
                                    >
                                        ⏱️ เปลี่ยน วินาที ➔ นาที
                                    </button>

                                    <button className="mt-8 text-red-300 text-lg hover:text-red-400 font-bold underline" onClick={() => { if(!muted) soundFX.click(); setShowMenu(false); }}>ปิดหน้าต่าง ✖</button>
                                </div>
                            )}

                            {/* Bubble Modal: กติกา */}
                            {showRules && (
                                <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-30 glass-bubble p-10 flex flex-col items-center animate-pop w-[700px] text-center">
                                    <h2 className="text-4xl font-bold mb-6 text-yellow-300 drop-shadow-md">👉กติกาการเล่น👈</h2>
                                    <div className="bg-black/30 rounded-2xl p-6 text-left w-full mb-8 border border-white/20 shadow-inner">
                                        <p className="text-2xl mb-4 leading-relaxed">🧍 <span className="font-bold text-cyan-300">1.</span> เริ่มต้นให้ผู้เล่นยืนตรงกลางเพื่อรับคำถาม</p>
                                        <p className="text-2xl mb-4 leading-relaxed">🏃 <span className="font-bold text-cyan-300">2.</span> ขยับร่างกายไปที่ <span className="text-yellow-300">"โซนซ้าย"</span> หรือ <span className="text-yellow-300">"โซนขวา"</span> เพื่อเลือกคำตอบ</p>
                                        <p className="text-2xl mb-4 leading-relaxed">⏱️ <span className="font-bold text-cyan-300">3.</span> มีเวลาคิดและขยับตัวเพียง <span className="text-red-400 font-bold">10 วินาที!</span> ตอบผิดระวังหัวปูด😭</p>
                                        <p className="text-2xl leading-relaxed">🔄 <span className="font-bold text-cyan-300">4.</span> เมื่อเฉลยเสร็จ ให้รีบกลับมา "โซนตรงกลาง" ก่อนเริ่มข้อต่อไป</p>
                                    </div>
                                    <button className="px-10 py-4 bg-gradient-to-b from-red-400 to-red-600 rounded-full font-bold btn-3d text-2xl" onClick={() => { if(!muted) soundFX.click(); setShowRules(false); }}>เข้าใจแล้ว ลุยเลย! 🚀</button>
                                </div>
                            )}
                        </div>
                    )}

                    {/* --- หน้าเปลี่ยนฉาก (TRANSITION) --- */}
                    {gameState === 'TRANSITION' && (
                        <video 
                            src="gotoplay.mp4" 
                            autoPlay playsInline
                            className="absolute inset-0 w-full h-full object-cover z-30" 
                            onEnded={initGameVariables} 
                        />
                    )}

                    {/* --- หน้าเล่นเกม (PLAYING) --- */}
                    {gameState === 'PLAYING' && question && (
                        <div className="absolute inset-0 z-10 w-full h-full">
                            
                            {/* เส้นประแบ่งโซน (3 ส่วน) */}
                            <div className="absolute left-[33.33%] top-0 bottom-0 border-r-[6px] border-dashed border-white/30 shadow-[0_0_15px_rgba(255,255,255,0.4)] z-0"></div>
                            <div className="absolute right-[33.33%] top-0 bottom-0 border-l-[6px] border-dashed border-white/30 shadow-[0_0_15px_rgba(255,255,255,0.4)] z-0"></div>

                            {/* สัญลักษณ์แจ้งเตือนตรวจจับใบหน้า */}
                            {!camActive && (
                                <div className="absolute top-4 right-28 glass-bubble px-4 py-2 text-yellow-300 font-bold animate-pulse">
                                    กำลังเปิดกล้อง...
                                </div>
                            )}
                            {camActive && faces.length > 0 && (
                                <div className="absolute top-6 left-6 glass-bubble px-6 py-3 text-xl font-bold text-green-300 flex items-center gap-2">
                                    <span className="relative flex h-4 w-4">
                                      <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                      <span className="relative inline-flex rounded-full h-4 w-4 bg-green-500"></span>
                                    </span>
                                    ตรวจพบนักสืบ: {faces.length} คน
                                </div>
                            )}

                            {/* HUD: บอกจำนวนข้อ (มุมขวาบน) */}
                            <div className="absolute top-6 right-[120px] glass-bubble px-8 py-3 text-3xl font-bold text-yellow-300 shadow-[0_0_15px_rgba(253,224,71,0.3)]">
                                ภารกิจที่ {qIndex + 1}/10
                            </div>

                            {/* --- พื้นที่เล่นเกม (แบ่ง 3 โซน) --- */}
                            <div className="w-full h-full flex">
                                
                                {/* โซนซ้าย (คำตอบ 1) */}
                                <div className="w-1/3 h-full flex items-center justify-center p-8 relative">
                                    <div className={`glass-bubble w-full h-[350px] flex flex-col items-center justify-center transition-all duration-700 ease-in-out
                                        ${phase === 'ANSWERING' ? 
                                            (question.isLeftCorrect ? 'bg-green-500/80 border-green-300 scale-105 shadow-[0_0_30px_rgba(74,222,128,0.6)]' : 'bg-red-500/50 border-red-400 opacity-50') 
                                            : 'hover:scale-105 bg-indigo-900/40'}`}>
                                        
                                        <h2 className="text-6xl font-bold drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-white text-center px-4">
                                            {question.isLeftCorrect ? question.correctText : question.wrongText}
                                        </h2>
                                        
                                        {/* เครื่องหมายถูกเมื่อตอบถูก */}
                                        {phase === 'ANSWERING' && question.isLeftCorrect && (
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[150px] animate-pop drop-shadow-2xl">
                                                ✅
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* โซนกลาง (คำถาม / เวลานับถอยหลัง / Reset) */}
                                <div className="w-1/3 h-full flex flex-col items-center justify-start pt-12 px-6">
                                    
                                    {/* ป้ายคำถาม (โผล่เสมอ) */}
                                    <div className={`glass-bubble w-full py-8 text-center shadow-2xl z-20 transition-all duration-500 ${phase === 'RESETTING' ? 'bg-yellow-500/70 border-yellow-300' : 'bg-indigo-800/70'}`}>
                                        {phase === 'RESETTING' ? (
                                            <div className="animate-pop">
                                                <h1 className="text-6xl font-bold text-yellow-100 drop-shadow-md mb-2 tracking-wider">RESET</h1>
                                                <p className="text-3xl text-white">วิ่งกลับมาตรงกลางด่วน!</p>
                                            </div>
                                        ) : (
                                            <div className="animate-pop">
                                                <p className="text-2xl text-cyan-200 mb-2 font-semibold">เปลี่ยนหน่วยเวลา</p>
                                                <h1 className="text-7xl font-bold text-white drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">
                                                    {question.text}
                                                </h1>
                                            </div>
                                        )}
                                    </div>

                                    {/* บับเบิ้ลนาฬิกา */}
                                    <div className="flex-grow flex items-center justify-center relative">
                                        <div className={`glass-bubble rounded-full w-[220px] h-[220px] flex items-center justify-center border-8 transition-colors duration-300
                                            ${timer <= 3 && phase === 'ASKING' ? 'border-red-500 text-red-100 bg-red-900/80 animate-shake shadow-[0_0_40px_rgba(239,68,68,0.8)]' 
                                            : phase === 'RESETTING' ? 'border-yellow-400 text-yellow-300 bg-yellow-900/50'
                                            : 'border-cyan-400 text-cyan-100 bg-cyan-900/50 shadow-[0_0_30px_rgba(34,211,238,0.5)]'}`}>
                                            
                                            <span className="text-[100px] font-bold drop-shadow-lg">{timer}</span>
                                        </div>
                                    </div>
                                </div>

                                {/* โซนขวา (คำตอบ 2) */}
                                <div className="w-1/3 h-full flex items-center justify-center p-8 relative">
                                    <div className={`glass-bubble w-full h-[350px] flex flex-col items-center justify-center transition-all duration-700 ease-in-out
                                        ${phase === 'ANSWERING' ? 
                                            (!question.isLeftCorrect ? 'bg-green-500/80 border-green-300 scale-105 shadow-[0_0_30px_rgba(74,222,128,0.6)]' : 'bg-red-500/50 border-red-400 opacity-50') 
                                            : 'hover:scale-105 bg-indigo-900/40'}`}>
                                        
                                        <h2 className="text-6xl font-bold drop-shadow-[0_4px_4px_rgba(0,0,0,0.8)] text-white text-center px-4">
                                            {!question.isLeftCorrect ? question.correctText : question.wrongText}
                                        </h2>
                                        
                                        {/* เครื่องหมายถูกเมื่อตอบถูก */}
                                        {phase === 'ANSWERING' && !question.isLeftCorrect && (
                                            <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-[150px] animate-pop drop-shadow-2xl">
                                                ✅
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* วาด UI ครอบใบหน้าผู้เล่น */}
                            {faces.map((face, i) => {
                                // แปลงพิกัดสำหรับภาพ Mirror
                                const xPos = (1 - face.xCenter) * 100;
                                const yPos = face.yCenter * 100;
                                // ตรวจสอบว่าใบหน้านี้อยู่ในกลุ่มที่ตอบผิดหรือไม่
                                const isWrong = wrongFaces.includes(face);
                                
                                return (
                                    <div key={i} className="absolute pointer-events-none transform -translate-x-1/2 -translate-y-1/2 z-50 transition-all duration-75" style={{ left: `${xPos}%`, top: `${yPos}%` }}>
                                        {/* กรอบสี่เหลี่ยมรอบใบหน้าแนวไซไฟ */}
                                        <div className="w-24 h-24 border-4 border-cyan-400 rounded-3xl opacity-50 shadow-[0_0_15px_rgba(34,211,238,0.8)]"></div>
                                        
                                        {/* อิโมจิเมื่อตอบผิด (เด้งขึ้นมา 3 วิ) */}
                                        {isWrong && phase === 'ANSWERING' && (
                                            <div className="absolute -top-28 left-1/2 transform -translate-x-1/2 text-[90px] animate-pop drop-shadow-2xl">
                                                😭
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {/* --- หน้าจบเกม (END) --- */}
                    {gameState === 'END' && (
                        <div className="absolute inset-0 z-20 flex flex-col items-center justify-end pb-[10vh]">
                            {/* วิดีโอพื้นหลังจบเกม */}
                            <video src="endpage.mp4" autoPlay loop muted={muted} className="absolute inset-0 w-full h-full object-cover -z-10" />
                            
                            <div className="flex gap-16 items-end animate-float">
                                {/* ปุ่มกลับหน้าแรก */}
                                <img src="homebutton_2.png" alt="Home" 
                                    className="w-[280px] cursor-pointer hover:scale-110 btn-3d rounded-full border-4 border-white/20"
                                    onClick={() => { if(!muted) soundFX.click(); setGameState('HOME'); }} />
                                
                                {/* ปุ่มเล่นอีกครั้ง */}
                                <img src="playagainbutton_2.png" alt="Play Again" 
                                    className="w-[280px] cursor-pointer hover:scale-110 btn-3d rounded-full border-4 border-white/20 shadow-[0_0_30px_rgba(255,215,0,0.6)]"
                                    onClick={() => { if(!muted) soundFX.click(); initGameVariables(); }} />
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
